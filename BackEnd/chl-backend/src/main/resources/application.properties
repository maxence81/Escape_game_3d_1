# ==============================================================
# CONFIGURATION DU SERVEUR
# ==============================================================
# Port sur lequel le serveur backend démarrera
server.port=8080
# Si vous avez des problèmes de port occupé (ex: 8080 déjà utilisé), vous pouvez le changer ici (ex: 8081).
# Pensez à mettre à jour la constante API_BASE_URL (dans api.js côté front) si vous changez ce port en local.

# ==============================================================
# CONFIGURATION DE LA BASE DE DONNÉES (MySQL)
# ==============================================================
# Assurez-vous de créer une base de données vide nommée 'escape_game_db' dans votre MySQL (Workbench ou autre).
# Remplacez l'URL si vous passez d'une base de données cloud (AWS RDS comme actuellement) à une base locale
# (ex: jdbc:mysql://localhost:3306/escape_game_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true).
spring.datasource.url=jdbc:mysql://mysql-ptut.cxq4y86iaha7.eu-west-3.rds.amazonaws.com:3306/escape_game_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Nom d'utilisateur de la base de données. Remplacez "admin" par votre utilisateur (ex: "root" en local).
spring.datasource.username=admin

# Mot de passe de la base de données. Remplacez par le vôtre. S'il n'y en a pas, laissez vide (ex: root sans mot de passe).
spring.datasource.password=admin1234

# Driver utilisé pour se connecter à MySQL. N'a pas besoin d'être changé si vous restez sur MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# CONFIGURATION DE JPA / HIBERNATE (ORM)
# ==============================================================
# Stratégie de mise à jour du schéma de base de données.
# 'update' : Crée les tables si elles n'existent pas, et les met à jour si vous ajoutez des colonnes, sans supprimer les données.
# 'create-drop' : Supprime et recrée tout le schéma à chaque démarrage (utile en développement très primaire, mais supprime toutes vos données).
# 'validate' : Vérifie simplement si les entités Java correspondent aux tables de la base de données.
spring.jpa.hibernate.ddl-auto=update

# Afficher les requêtes SQL dans la console de votre environnement de développement ou terminal.
# Très utile pour le débogage. Si vous trouvez les logs trop bavards, passez à "false".
spring.jpa.show-sql=true

# Formater de manière lisible (sauts de lignes) les requêtes SQL affichées dans la console.
spring.jpa.properties.hibernate.format_sql=true

# Dialecte MySQL utilisé pour permettre à Hibernate de générer les requêtes SQL optimales pour votre version de base de données.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================================================
# CONFIGURATION DE SÉCURITÉ JWT (JSON Web Token)
# ==============================================================
# Clé secrète utilisée par le backend (dans JwtUtils.java) pour signer cryptographiquement les tokens.
# IMPORTANT : Elle doit être une chaîne très longue (au moins 64 caractères recommandés pour l'algorithme HS512) et ultra secrète !
# Si vous changez cette clé, tous les tokens générés précédemment pour tous les utilisateurs perdront leur validité (reconnexion obligatoire).
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Temps d'expiration du token JWT exprimé en millisecondes.
# Ici il est réglé sur 86400000 ms, ce qui équivaut à 24 heures (1000ms * 60s * 60m * 24h).
# Mettez une valeur plus courte (ex: 3600000 pour 1h) pour monter le niveau de sécurité.
app.jwt.expiration-ms=86400000

# ==============================================================
# AUTRES CONFIGURATIONS ET LOGS
# ==============================================================
# Niveau de journalisation (log) ciblé sur la sécurité Spring.
# En le mettant à DEBUG, vous observerez plus d'informations dans les logs sur pourquoi une API renvoie 403 (Accès Refusé) ou 401.
logging.level.org.springframework.security=DEBUG

# Niveau de log général pour la partie Web. INFO est idéal pour la production.
logging.level.org.springframework.web=INFO